version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: hirely_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hirely
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirely_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: hirely_mailhog
    ports:
      - "1025:1025"  # SMTP server for testing
      - "8025:8025"  # Web UI
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /mail

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: hirely_network
