services:
  mailhog:
    image: mailhog/mailhog
    container_name: hirely_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /mail
    networks:
      - hirely

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirely_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      FRONTEND_URL: http://34.61.116.237:5173
    env_file:
      - ./backend/.env
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hirely

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://34.61.116.237:3000/api/v1}
    container_name: hirely_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - hirely


volumes:
  backend_uploads:
    driver: local

networks:
  hirely:
    name: hirely_network
    driver: bridge
